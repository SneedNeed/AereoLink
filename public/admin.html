<!DOCTYPE html>
<html lang="es">
    <head>
        <title>AereoLink - Panel de administración</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="img/logo.svg" type="image/svg+xml">
        <script src="https://kit.fontawesome.com/6ed9f78524.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/auth.css">
        <link rel="stylesheet" href="css/app.css">
    </head>
    <body>
        <header class="header" id="appHeader"></header>

        <main class="main">
            <div class="page-container admin-container">
                <h2 class="page-title">Panel de administración</h2>
                <p class="page-subtitle">Gestiona vuelos, reservas, clientes y aerolíneas.</p>

                <div class="tabs-bar" id="tabs" role="tablist">
                    <button type="button" class="tab-btn active" data-tab="resumen" role="tab"><i class="fa-solid fa-chart-pie"></i> Resumen</button>
                    <button type="button" class="tab-btn" data-tab="vuelos" role="tab"><i class="fa-solid fa-plane"></i> Vuelos</button>
                    <button type="button" class="tab-btn" data-tab="reservas" role="tab"><i class="fa-solid fa-ticket"></i> Reservas</button>
                    <button type="button" class="tab-btn" data-tab="clientes" role="tab"><i class="fa-solid fa-users"></i> Clientes</button>
                    <button type="button" class="tab-btn" data-tab="aerolineas" role="tab"><i class="fa-solid fa-building"></i> Aerolíneas</button>
                </div>

                <section class="admin-panel" id="panel-resumen">
                    <div class="stat-grid" id="estadisticas"></div>
                    <div class="admin-two">
                        <div class="card"><h3 class="card-title">Rutas más vendidas</h3><div id="rutasTop"></div></div>
                        <div class="card"><h3 class="card-title">Aerolíneas con más ventas</h3><div id="aerolineasTop"></div></div>
                    </div>
                </section>

                <section class="admin-panel" id="panel-vuelos" hidden>
                    <div class="card">
                        <form class="admin-filters" id="filtrosVuelos">
                            <input class="control" type="search" name="q" placeholder="Código de vuelo" aria-label="Código de vuelo">
                            <select class="control" name="origen" aria-label="Origen"><option value="">Origen: todos</option></select>
                            <select class="control" name="destino" aria-label="Destino"><option value="">Destino: todos</option></select>
                            <input class="control" type="date" name="fecha" aria-label="Fecha de salida">
                            <select class="control" name="estado" aria-label="Estado">
                                <option value="">Estado: todos</option>
                                <option value="PROGRAMADO">Programado</option>
                                <option value="RETRASADO">Retrasado</option>
                                <option value="EN_VUELO">En vuelo</option>
                                <option value="ATERRIZADO">Aterrizado</option>
                                <option value="CANCELADO">Cancelado</option>
                            </select>
                            <label class="check-row"><input type="checkbox" name="pasados" value="1"> Incluir vuelos pasados</label>
                            <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-magnifying-glass"></i> Filtrar</button>
                            <button type="button" class="btn btn-outline btn-sm" id="limpiarVuelos">Limpiar</button>
                            <span class="spacer"></span>
                            <button type="button" class="btn btn-primary btn-sm" id="nuevoVuelo"><i class="fa-solid fa-plus"></i> Nuevo vuelo</button>
                        </form>
                        <div class="table-wrap"><table class="data-table" id="tablaVuelos"></table></div>
                        <div class="pager" id="paginadorVuelos"></div>
                    </div>
                </section>

                <section class="admin-panel" id="panel-reservas" hidden>
                    <div class="card">
                        <form class="admin-filters" id="filtrosReservas">
                            <input class="control" type="search" name="q" placeholder="Código, cliente o correo" aria-label="Buscar reservas">
                            <select class="control" name="estado" aria-label="Estado">
                                <option value="">Estado: todos</option>
                                <option value="PENDIENTE">Pendiente</option>
                                <option value="CONFIRMADA">Confirmada</option>
                                <option value="CANCELADA">Cancelada</option>
                                <option value="EXPIRADA">Expirada</option>
                            </select>
                            <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-magnifying-glass"></i> Filtrar</button>
                            <button type="button" class="btn btn-outline btn-sm" id="limpiarReservas">Limpiar</button>
                        </form>
                        <div class="table-wrap"><table class="data-table" id="tablaReservas"></table></div>
                    </div>
                </section>

                <section class="admin-panel" id="panel-clientes" hidden>
                    <div class="card">
                        <form class="admin-filters" id="filtrosClientes">
                            <input class="control" type="search" name="q" placeholder="Nombre, correo o documento" aria-label="Buscar clientes">
                            <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
                            <button type="button" class="btn btn-outline btn-sm" id="limpiarClientes">Limpiar</button>
                        </form>
                        <div class="table-wrap"><table class="data-table" id="tablaClientes"></table></div>
                    </div>
                </section>

                <section class="admin-panel" id="panel-aerolineas" hidden>
                    <div class="card">
                        <div class="table-wrap"><table class="data-table" id="tablaAerolineas"></table></div>
                    </div>
                </section>
            </div>
        </main>

        <dialog class="modal" id="dlgVuelo">
            <form class="modal-card modal-wide" id="formVuelo" novalidate>
                <h3 class="modal-title">Nuevo vuelo directo</h3>
                <p class="form-alert" role="alert" hidden></p>
                <div class="field-row">
                    <div class="field-container">
                        <select class="field-input input" name="id_aerolinea"></select>
                        <label class="label field-label">Aerolínea</label>
                        <p class="field-error"></p>
                    </div>
                    <div class="field-container">
                        <input class="field-input input" type="text" name="codigo_vuelo" placeholder=" " maxlength="15" autocomplete="off">
                        <label class="label field-label">Código (opcional)</label>
                        <p class="field-error"></p>
                    </div>
                </div>
                <div class="field-row">
                    <div class="field-container">
                        <select class="field-input input" name="origen"></select>
                        <label class="label field-label">Origen</label>
                        <p class="field-error"></p>
                    </div>
                    <div class="field-container">
                        <select class="field-input input" name="destino"></select>
                        <label class="label field-label">Destino</label>
                        <p class="field-error"></p>
                    </div>
                </div>
                <div class="field-row">
                    <div class="field-container">
                        <input class="field-input input" type="datetime-local" name="salida">
                        <label class="label field-label">Salida</label>
                        <p class="field-error"></p>
                    </div>
                    <div class="field-container">
                        <input class="field-input input" type="datetime-local" name="llegada">
                        <label class="label field-label">Llegada</label>
                        <p class="field-error"></p>
                    </div>
                </div>
                <div class="field-row">
                    <div class="field-container">
                        <input class="field-input input" type="number" name="capacidad_total" placeholder=" " min="1" max="850" value="180">
                        <label class="label field-label">Sillas</label>
                        <p class="field-error"></p>
                    </div>
                    <div class="field-container">
                        <input class="field-input input" type="number" name="precio_base" placeholder=" " min="1000" step="1000">
                        <label class="label field-label">Precio base (COP)</label>
                        <p class="field-error"></p>
                    </div>
                </div>
                <p class="field-help">Se crean automáticamente tres tarifas: Light, Classic y Premium Flex, calculadas a partir del precio base.</p>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" data-cerrar>Cancelar</button>
                    <button type="submit" class="btn btn-primary">Crear vuelo</button>
                </div>
            </form>
        </dialog>

        <dialog class="modal" id="dlgReserva">
            <div class="modal-card modal-wide" id="detalleReserva"></div>
        </dialog>

        <script src="js/comun.js"></script>
        <script src="js/admin.js"></script>
    </body>
</html>
